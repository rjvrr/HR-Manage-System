<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector CSS</title>
  <style>
    .a{
        background-color: beige;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        font-weight: 300;
        text-align: center;
        font-size: 25px;
    }
    .b{
        font-family:Arial, Helvetica, sans-serif;
        font-weight:300;
        font-size: 25px;
        text-align: center;
        background-color: rgb(241, 205, 251);
    }
    .c{
        background-color:rgb(225, 166, 166);
        text-align: center;
    }
    .d{
        background-color: rgb(184, 184, 228);
        text-align: center;
    }
    .img1{
        height: 150px;
        border: 3px solid rgb(0, 0, 0);
        transition: padding 0.5ms;
    }
    .img1:hover{
        padding: 5px;   
    }
    .img2{
        height:150px;
        border: 3px solid rgb(0, 0, 0);
        margin-left:20px;
        transition: height 2ms;
    }
    .img2:hover{
        height:155px;   
    }

    

  </style>
</head>

<body>

  <!--selector and types of selector-->
  <!--universal ; class and id ; grouping ; elemnt ; desedent -->
  <P class = "a">
    FSD training
  </P>

  <p class = "b">Basics of CSS</p>

  <h1 class = "c">
    this is selector
  </h1>

  <h1 class = "d">
    selector
  </h1>

  <img class = "img1" src="https://th.bing.com/th/id/OIP.JNg3U0r-QyS9SR555MX9NgHaE8?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3">

  <img class = "img2" src="https://th.bing.com/th/id/OIP.RjB4h5QKA8urarTlZncxLQHaFk?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3">

</body>
</html>
