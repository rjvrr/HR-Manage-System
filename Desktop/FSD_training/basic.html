<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    .a{
      width:1000px;
      height: 70px;
      text-align: left;
      color: rgb(29, 128, 29);
      background-color: rgb(198, 252, 198);
      border:none; 
    }
    .b{
      width:1000px;
      height: 70px;
      text-align: left;
      color: rgb(177, 73, 73);
      background-color: rgb(252, 198, 198);
      border:none; 
    }
    .c{
      width:1000px;
      height: 70px;
      text-align: left;
      color: rgb(163, 159, 32);
      background-color: rgb(252, 247, 198);
      border:none; 
    }
    .d{
      width:1000px;
      height: 70px;
      text-align: left;
      color: rgb(29, 64, 128);
      background-color: rgb(198, 207, 252);
      border:none; 
    }

  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS.Basics</title>
</head>
<body>
  <button class = "a">Success</button>
  <br><br>
  <button class = "b">Info</button>
  <br><br>
  <button class = "c">warning</button>
  <br><br>
  <button class = "d">error</button>
  
</body>
</html>
