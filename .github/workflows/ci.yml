name: HRGenius CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs only for PRs; preserve concurrent runs on main/master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Backend CI: Spring Boot / Java 17 / Maven
  # =========================================================================
  backend:
    name: Backend CI (Java 17 / Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Desktop/healthcare

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x ./mvnw

      - name: Compile and run backend tests
        # Runs automated unit tests against the test profile (H2 in-memory DB)
        run: ./mvnw -B clean test

      - name: Package Spring Boot executable archive
        # Verifies Spring Boot repackaging produces a runnable jar without re-running tests
        run: ./mvnw -B package -DskipTests

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: Desktop/healthcare/target/surefire-reports/
          retention-days: 7

      - name: Upload Spring Boot Application JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hrgenius-backend-jar
          path: Desktop/healthcare/target/*.jar
          retention-days: 7

  # =========================================================================
  # 2. Frontend CI: Node 22 / Angular / Vitest
  # =========================================================================
  frontend:
    name: Frontend CI (Node 22 / Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Verify TypeScript compilation
        # Catches strict TypeScript typing errors without generating emit files
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Run Angular unit tests
        # Executes Vitest test runner with JSDOM environment in headless mode
        run: npm test -- --watch=false

      - name: Build Angular production bundle
        # Generates production-optimized bundle and validates budget limits
        run: npm run build

      - name: Upload Frontend Production Bundle
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hrgenius-frontend-dist
          path: frontend/dist/frontend/
          retention-days: 7

  # =========================================================================
